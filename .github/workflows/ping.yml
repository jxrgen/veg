name: Daily Supabase Ping

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6:00 AM UTC
  workflow_dispatch:     # Manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to keep DB active
        run: |
          curl -X POST \
            'https://ujxmftvftcbjrdmzhlrw.supabase.co/rest/v1/rpc/ping_keep_alive' \
            -H 'apikey: sb_publishable_EeimAI1x6_X1KxT-Clw5Bg_zIveRDYb' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            -w '\nStatus: %{http_code}\n'
